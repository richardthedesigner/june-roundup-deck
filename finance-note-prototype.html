<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance · a note · shimmer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@200;300;400;500;700;800;900&family=Karla:wght@300;400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --paper-canvas:#fafaf7; --paper-page:#f3f3ee; --paper-panel:#ebebe6; --paper-deep:#e2e2dc;
    --ink:#0a0a0a; --ink-body:#1f1f1f; --ink-soft:#4a4a4a; --ink-mute:#7a7a7a; --ink-quiet:#a8a8a8;
    --line:#d4d4cf; --line-soft:#e0e0db; --lime:#bcfb49; --ease:cubic-bezier(0.22,0.61,0.36,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  ::selection{background:var(--lime); color:var(--ink);}
  html,body{height:100%;}
  body{background:#111; color:var(--ink-body); font-family:'Karla',sans-serif; font-weight:300; -webkit-font-smoothing:antialiased; overflow:hidden;}

  .slide{position:fixed; inset:0; display:flex; flex-direction:column; background:var(--paper-canvas);}
  .frame{flex:1; display:flex; flex-direction:column; padding:clamp(44px,4.6vw,80px) clamp(56px,7vw,116px) clamp(88px,10vh,116px); position:relative; min-height:0;}
  .eyebrow{display:flex; align-items:center; gap:18px; flex:none; font-family:'Karla',sans-serif; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:0.22em; color:var(--ink-mute);}
  .eyebrow::before{content:''; width:32px; height:2px; background:var(--lime); display:inline-block; flex:none;}
  .foot{position:absolute; left:clamp(56px,7vw,116px); right:clamp(56px,7vw,116px); bottom:clamp(32px,4vh,52px); display:flex; justify-content:space-between; align-items:center;}
  .foot .wm{font-family:'Epilogue',sans-serif; font-weight:800; font-size:14px; text-transform:lowercase; color:var(--ink); display:flex; align-items:center; gap:5px;}
  .foot .wm .sq{width:6px; height:6px; background:var(--lime); display:inline-block;}
  .nav{display:flex; align-items:center; gap:14px; color:var(--ink-soft);}
  .nav-btn{background:none; border:1px solid currentColor; color:var(--ink-soft); width:32px; height:32px; font-family:'Epilogue',sans-serif; font-size:16px; opacity:0.5; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .counter{font-family:'Karla',sans-serif; font-weight:700; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--ink-mute); min-width:90px; text-align:center;}

  /* the field: contained box of fine diagonal lines, edge to edge */
  .field{
    position:relative; align-self:center; margin:auto 0;
    width:min(1060px,100%); height:min(560px,60vh);
    border:1px solid var(--line); overflow:hidden;
    background-image:repeating-linear-gradient(45deg, rgba(10,10,16,0.12) 0, rgba(10,10,16,0.12) 1px, transparent 1px, transparent 14px);
    background-color:var(--paper-canvas);
  }
  /* animated sheen drifting across the hatch */
  .field::after{
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(105deg, transparent 40%, rgba(250,250,247,0.85) 50%, transparent 60%);
    background-size:260% 100%; background-position:175% 0;
    animation:sheen 8s var(--ease) infinite;
  }
  @keyframes sheen{0%{background-position:175% 0;} 60%,100%{background-position:-90% 0;}}
  @media (prefers-reduced-motion:reduce){ .field::after{animation:none; opacity:0;} }

  /* the lime note resting on the field */
  .note{
    position:absolute; z-index:2; right:clamp(34px,4%,64px); bottom:clamp(34px,7%,72px);
    width:clamp(248px,31%,330px); min-height:clamp(230px,42%,308px);
    background:var(--lime); color:var(--ink);
    box-shadow:0 26px 52px -24px rgba(10,10,16,0.30);
    padding:clamp(28px,2.6vw,40px); display:flex; flex-direction:column; justify-content:flex-end;
  }
  .note .h{font-family:'Instrument Serif',serif; font-style:italic; font-weight:400; font-size:clamp(32px,3vw,48px); line-height:1.0; letter-spacing:-0.01em; color:var(--ink);}
  .note .h b{font-family:'Epilogue',sans-serif; font-style:normal; font-weight:800; letter-spacing:-0.03em;}
</style>
</head>
<body>
<section class="slide">
  <div class="frame">
    <div class="eyebrow">Finance · A note to follow</div>
    <div class="field">
      <div class="note">
        <div class="h">A note,<br>from our <b>CFO.</b></div>
      </div>
    </div>
  </div>
  <div class="foot"><div class="wm">tbscg<span class="sq"></span></div><div class="nav"><button class="nav-btn"><span>‹</span></button><div class="counter">Finance</div><button class="nav-btn"><span>›</span></button></div></div>
</section>
</body>
</html>
